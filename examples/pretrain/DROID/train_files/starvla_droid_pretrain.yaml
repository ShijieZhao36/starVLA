# Approved: neo-bj4, 8 GPUs x batch 8, fresh Qwen3-VL + LN action head.
run_id: droid_stage3_ln_8gpu_30k
run_root_dir: /mnt/zhaoshijie/checkpoints/starVLA
seed: 42
wandb_entity: jasperz-georgia-institute-of-technology
wandb_project: pretrain
is_debug: false
version_id: '0.21'
framework:
  name: QwenPI
  qwenvl:
    base_vlm: /mnt/zhaoshijie/workspace/starVLA/playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 90
    state_dim: 90
    action_horizon: 8
    decoder_input_norm: true
datasets:
  vla_data:
    dataset_py: gr00t_sharded
    data_root_dir: /mnt/zhaoshijie/dataset/oxe_franka_lerobot/droid_1.0.1/stage3_unmasked_20261021_142915/job/full
    data_mix: droid_stage3_unmasked
    canonical_layout: examples/pretrain/canonical/bimanual_v1.yaml
    canonical_robots: examples/pretrain/canonical/robots
    include_state: false
    obs_image_size:
    - 256
    - 256
    frame_cache_dir: /mnt/zhaoshijie/frame_cache/droid_stage3_unmasked_256
    use_percentiles: true
    use_relative_action: true
    per_device_batch_size: 8
    num_workers: 4
    shard_size: 1024
    episode_sampling_rate: 1.0
    audit_sampling: true
trainer:
  pretrained_checkpoint: null
  is_resume: false
  max_train_steps: 30000
  num_warmup_steps: 2500
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  reload_modules: null
  audit_source_exposure: true
  audit_initial_model: true
  save_format: pt
