run_id: libero_plus_pair_ln_8gpu_60k
run_root_dir: /mnt/zhaoshijie/checkpoints/starVLA
seed: 42
wandb_entity: jasperz-georgia-institute-of-technology
wandb_project: pretrain
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: /mnt/zhaoshijie/workspace/starVLA/playground/Pretrained_models/Qwen3-VL-4B-Instruct
    # Qwen3.py in the audited training revision uses SDPA internally.
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 90
    state_dim: 90
    action_horizon: 8
    decoder_input_norm: true

datasets:
  vla_data:
    dataset_py: gr00t_sharded
    data_root_dir: /mnt/zhaoshijie/dataset/_processed/libero_plus/stage1
    data_mix: libero_plus_stage1
    canonical_layout: examples/pretrain/canonical/bimanual_v1.yaml
    canonical_robots: examples/pretrain/canonical/robots
    include_state: false
    obs_image_size: [256, 256]
    frame_cache_dir: /mnt/zhaoshijie/frame_cache/libero_plus_stage1_256
    use_percentiles: true
    use_relative_action: true
    per_device_batch_size: 8
    num_workers: 4
    shard_size: 1024
    episode_sampling_rate: 1.0
    audit_sampling: true

trainer:
  # The runner replaces this with the selected completed 80k final_model.
  # Null reload_modules loads the complete model; fresh optimizer/scheduler.
  pretrained_checkpoint: null
  reload_modules: null
  strict_pretrained_load: true
  is_resume: false
  max_train_steps: 60000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  save_format: pt
  audit_source_exposure: true
  audit_initial_model: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
