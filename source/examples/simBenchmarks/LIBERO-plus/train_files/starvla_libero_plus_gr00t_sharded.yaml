run_id: libero_plus_qwen3vl_pi_gr00t_relative
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: pretrain
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 10
    state_dim: 10
    action_horizon: 8

datasets:
  vla_data:
    dataset_py: gr00t_sharded
    # Parent of dataset_absolute. The mix appends that directory name.
    data_root_dir: /mnt/zhaoshijie/dataset/_processed/libero_plus/stage1
    data_mix: libero_plus_stage1
    include_state: false
    use_percentiles: true
    # Disk actions are absolute xyz+rot6d. The processor rewrites right_eef
    # relative to the chunk-start state. The gripper stays absolute.
    use_relative_action: true
    per_device_batch_size: 8
    num_workers: 4
    shard_size: 1024
    episode_sampling_rate: 1.0

trainer:
  max_train_steps: 60000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
